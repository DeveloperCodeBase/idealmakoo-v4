version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://idealmakoo_app:idealmakoo_pass@postgres:5432/idealmakoo_db
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ankane/pgvector:v0.5.1
    environment:
      - POSTGRES_USER=idealmakoo_app
      - POSTGRES_PASSWORD=idealmakoo_pass
      - POSTGRES_DB=idealmakoo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idealmakoo_app -d idealmakoo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
